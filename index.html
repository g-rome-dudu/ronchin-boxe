<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>On l'accuse de tout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
      max-width: 700px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #c62828;
    }
    #form, #reasons {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    .reason {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    .reason:last-child {
      border-bottom: none;
    }
    button {
      background: #c62828;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #a91f1f;
    }
  </style>
</head>
<body>

  <h1>⭐ Le mec qu’on accuse toujours de tout ⭐</h1>

  <div id="form">
    <h2>Ajouter une nouvelle accusation</h2>
    <input id="input" type="text" placeholder="Ex : Le robinet cassé dans les toilettes" style="width:100%; padding:10px;">
    <button onclick="addReason()">Ajouter</button>
  </div>

  <div id="reasons">
    <h2>Liste officielle des accusations</h2>
    <div id="list"></div>
  </div>

  <script>
    const BIN_ID = "YOUR_BIN_ID";
    const API_KEY = "YOUR_API_KEY";

    async function loadReasons() {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${}/latest`, {
        headers: { "X-Master-Key":  }
      });
      const data = await res.json();
      const reasons = data.record.reasons;

      const list = document.getElementById("list");
      list.innerHTML = "";

      reasons.forEach(r => {
        const div = document.createElement("div");
        div.className = "reason";
        div.textContent = r;
        list.appendChild(div);
      });
    }

    async function addReason() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const data = await res.json();
      const reasons = data.record.reasons;

      reasons.push(text + " → c’est lui.");

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ reasons })
      });

      input.value = "";
      loadReasons();
    }

    loadReasons();
  </script>

</body>
</html>
