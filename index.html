<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>On l'accuse de tout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
      max-width: 700px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #c62828;
    }
    #form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    #reasons {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .reason {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    .reason:last-child {
      border-bottom: none;
    }
    button {
      background: #c62828;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #a91f1f;
    }
  </style>
</head>
<body>

  <h1>⭐ Le mec qu’on accuse toujours de tout ⭐</h1>

  <div id="form">
    <h2>Ajouter une nouvelle accusation</h2>
    <p>Une raison pour laquelle c’est encore sa faute :</p>
    <input id="input" type="text" placeholder="Ex : Le robinet cassé dans les toilettes" style="width:100%; padding:10px;">
    <button onclick="addReason()">Ajouter</button>
  </div>

  <div id="reasons">
    <h2>Liste officielle des accusations</h2>

    <div class="reason">Le robinet des toilettes cassé → c’est lui.</div>
    <div class="reason">Les volants de badminton coincés → c’est lui.</div>
    <div class="reason">Les gants qui puent → c’est lui.</div>
  </div>

  <script>
    function addReason() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      const container = document.getElementById('reasons');
      const div = document.createElement('div');
      div.className = 'reason';
      div.textContent = text + " → c’est lui.";

      container.appendChild(div);
      input.value = "";
    }
  </script>

</body>
</html>
